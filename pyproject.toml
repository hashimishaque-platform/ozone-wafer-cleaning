[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "dio3"
version = "0.1.0"
description = "Process model of ozonated water (DIO3) for photoresist removal on a spinning wafer"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Hashim Ishaque" }]
requires-python = ">=3.9"
dependencies = ["numpy", "scipy"]

[project.optional-dependencies]
figures = ["matplotlib"]
test = ["pytest"]

[project.urls]
Homepage = "https://hashimishaque.com/ozone-water-cleaning/"
Source = "https://github.com/hashimishaque-platform/ozone-water-cleaning"

[tool.setuptools]
packages = ["dio3"]

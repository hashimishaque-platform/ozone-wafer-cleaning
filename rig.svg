<text x="26" y="514.0" font-size="11" text-anchor="start">Tags after ISA-5.1. First letter: A analysis (ozone, resistivity),</text>
<text x="26" y="529.5" font-size="11" text-anchor="start">F flow, P pressure, S speed, T temperature. Then I indicate,</text>
<text x="26" y="545.0" font-size="11" text-anchor="start">T transmit, C control. 1xx gas, 2xx water, 3xx chamber, 4xx safety.</text>
<text x="44" y="560.5" font-size="11" text-anchor="start">Interlock: the generator stops and the ozone water valve shuts on</text>
<text x="44" y="576.0" font-size="11" text-anchor="start">0.1 ppm ambient ozone (AIT-401), low exhaust flow (FT-303), open</text>
<text x="44" y="591.5" font-size="11" text-anchor="start">lid, a leak in the drip tray, or low cooling water.</text>
